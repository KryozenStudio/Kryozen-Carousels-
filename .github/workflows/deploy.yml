name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract website ZIP
        run: |
          mkdir -p extracted _site
          unzip -q website.zip -d extracted

          INDEX=$(find extracted -name index.html -type f | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found in ZIP"
            exit 1
          fi

          cp -a "$(dirname "$INDEX")/." _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        
